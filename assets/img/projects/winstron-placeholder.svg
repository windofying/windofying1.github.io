<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Winstron project image placeholder</title>
  <desc id="description">Temporary placeholder for the Winstron Manufacturing Facility project image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142c" />
      <stop offset="1" stop-color="#0b5cab" />
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <g fill="none" stroke="#6fb6ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="640" y="180" width="320" height="300" rx="28" />
    <path d="M700 270h200M700 340h200M700 410h120" />
    <circle cx="880" cy="410" r="12" fill="#6fb6ff" stroke="none" />
  </g>
  <text x="800" y="610" fill="#ffffff" font-family="Arial, sans-serif" font-size="72" font-weight="700" text-anchor="middle">WINSTRON</text>
  <text x="800" y="690" fill="#c9dcff" font-family="Arial, sans-serif" font-size="34" letter-spacing="6" text-anchor="middle">PROJECT IMAGE COMING SOON</text>
</svg>
